name: Nix cache cleanup

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report unused cache entries without changing them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hestia-gc
  cancel-in-progress: false

jobs:
  gc:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          read-only: true
      - name: Remove unused cache data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
