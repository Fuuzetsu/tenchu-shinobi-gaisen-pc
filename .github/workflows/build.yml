name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and user-facing release notes
        env:
          REF: ${{ github.ref }}
        run: python3 packaging/release.py notes "$REF" release-notes.md

  build:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            package: linux-archive
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            package: linux-archive
          - target: windows-x86_64
            runner: ubuntu-24.04
            package: windows-archive
          - target: wasm32
            runner: ubuntu-24.04
            package: web-archive
          - target: dependency-sources
            runner: ubuntu-24.04
            package: dependency-sources-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
      - name: Cache Nix build outputs
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - name: Workflow, formatting, Clippy and portable core
        if: matrix.target == 'linux-x86_64'
        run: >-
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.formatting
          .#checks.x86_64-linux.clippy
          .#checks.x86_64-linux.wasm
          .#checks.x86_64-linux.ci
      - name: Build archive
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          nix build --print-build-logs ".#$PACKAGE"
          mkdir dist
          cp -L result/* dist/
          cd dist
          sha256sum --check SHA256SUMS
      - name: Test Linux archive without the Nix store
        if: startsWith(matrix.target, 'linux-')
        run: |
          bwrap=$(nix build --inputs-from . nixpkgs#bubblewrap --no-link --print-out-paths)/bin/bwrap
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          bundle=$(realpath unpacked/tenchu-linux-*)
          sudo "$bwrap" --ro-bind / / --tmpfs /nix --dev-bind /dev /dev --proc /proc \
            --unsetenv LD_LIBRARY_PATH -- "$bundle/tenchu-pc" --help
          cc packaging/check-libraries.c -o unpacked/check-libraries -ldl
          sudo "$bwrap" --ro-bind / / --tmpfs /nix --dev-bind /dev /dev --proc /proc \
            --unsetenv LD_LIBRARY_PATH -- "$bundle"/lib/ld-linux-*.so.* \
            --library-path "$bundle/lib" "$PWD/unpacked/check-libraries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tenchu-${{ matrix.target }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android:
    name: android-arm64
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 1
      - name: Cache Nix build outputs
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - name: Build Android APK
        env:
          TENCHU_BUILD_REVISION: ${{ github.sha }}
        run: |
          nix develop .#android --command cargo clippy --locked --lib -p tenchu-pc -- -D warnings
          ./tools/build-android.sh
      - name: Sign published APK
        if: >-
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          TENCHU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          TENCHU_BUILD_REVISION: ${{ github.sha }}
        run: |
          umask 077
          key="$RUNNER_TEMP/tenchu-signing.p12"
          trap 'rm -f "$key"' EXIT
          test -n "$SIGNING_KEYSTORE"
          test -n "$TENCHU_ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$key"
          export TENCHU_ANDROID_KEYSTORE="$key" TENCHU_ANDROID_RELEASE_KEY=1
          ./tools/build-android.sh
      - name: Package APK and checksum
        run: |
          mkdir dist
          cp target/android/arm64-v8a/tenchu-*-arm64-v8a.apk dist/tenchu-android-arm64.apk
          cd dist
          sha256sum tenchu-android-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tenchu-android-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-smoke:
    name: Windows executable startup
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tenchu-windows-x86_64-${{ github.sha }}
          path: dist
      - name: Extract and start the executable
        shell: pwsh
        run: |
          Expand-Archive dist/tenchu-windows-x86_64.zip -DestinationPath unpacked
          & ./unpacked/tenchu-windows-x86_64/tenchu-pc.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./unpacked/tenchu-windows-x86_64/tenchu-pc.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Publish complete downloads
    needs: [build, android, windows-smoke]
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tenchu-*-${{ github.sha }}
          path: artifacts
      - name: Publish version or rolling HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: master
        run: bash packaging/publish.sh
