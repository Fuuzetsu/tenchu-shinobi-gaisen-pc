[package]
name = "tenchu-pc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tenchu-assets.workspace = true
tenchu-audio.workspace = true
tenchu-core.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
glam.workspace = true
bytemuck.workspace = true
png.workspace = true
gilrs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
pollster.workspace = true
flate2 = "1"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
cpal = { version = "=0.18.2", features = ["audioworklet"] }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
js-sys = "=0.3.98"
console_error_panic_hook = "0.1.7"
web-sys = { version = "=0.3.98", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Response",
    "HtmlVideoElement", "HtmlMediaElement", "CanvasRenderingContext2d", "ImageData",
    "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode",
    "GainNode", "AudioParam", "Blob", "Url", "console", "Performance", "Location",
] }
