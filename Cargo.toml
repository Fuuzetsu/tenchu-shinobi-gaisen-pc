[workspace]
members = ["crates/tenchu-assets", "crates/tenchu-audio", "crates/tenchu-core", "crates/tenchu-pc"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
tenchu-assets = { path = "crates/tenchu-assets" }
tenchu-audio = { path = "crates/tenchu-audio" }
tenchu-core = { path = "crates/tenchu-core" }
sha2 = "0.10.9"
encoding_rs = "=0.8.35"
wgpu = "24.0.5"
winit = { version = "0.30.12", features = ["serde"] }
egui = "=0.31.1"
egui-wgpu = { version = "=0.31.1", default-features = false }
egui-winit = { version = "=0.31.1", default-features = false }
glam = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
cpal = { version = "=0.18.2", features = ["pulseaudio"] }
gilrs = { version = "=0.11.2", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
